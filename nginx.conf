server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Caché agresiva para assets con hash en el nombre
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2|woff)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # HTML: sin caché para que siempre tome la versión más nueva
    location ~* \.html$ {
        expires -1;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # SPA fallback — Astro genera páginas estáticas, pero por si acaso
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }

    # Compresión
    gzip on;
    gzip_types text/plain text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}

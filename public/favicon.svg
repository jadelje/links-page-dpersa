<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Fondo con gradiente café profundo -->
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#49342D"/>
      <stop offset="100%" stop-color="#6B4A40"/>
    </linearGradient>
  </defs>
  <rect width="100" height="100" rx="18" fill="url(#bg)"/>
  <!-- Línea decorativa champagne -->
  <rect x="14" y="62" width="72" height="2" rx="1" fill="#C6A15B" opacity="0.6"/>
  <!-- Letras DP -->
  <text x="50" y="57" font-size="46" font-weight="900" fill="#FAF6F2" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" letter-spacing="-2">DP</text>
  <!-- Subtexto "detalles" -->
  <text x="50" y="78" font-size="14" font-weight="600" fill="#C6A15B" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" letter-spacing="2">detalles</text>
</svg>
